<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Carina</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>📊 Controle Carina</h1>
</header>

<main class="container">

    <section class="card">
        <h2>Saldo Atual</h2>
        <div id="saldo" class="saldo">9</div>
    </section>

    <section class="card">
        <h2>Novo Lançamento</h2>

        <label>Responsável</label>

        <select id="responsavel">
            <option>Carina</option>
            <option>Reinaldo</option>
        </select>

        <label>Quantidade</label>

        <input type="number" id="quantidade" value="1" min="1">

        <button onclick="receberProduto()">
            ➕ Receber Produto (+6 pizzas)
        </button>

        <button onclick="registrarRetirada()">
            ➖ Registrar Retirada
        </button>
    </section>

    <section class="card">
        <h2>Histórico</h2>

        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Movimento</th>
                </tr>
            </thead>

            <tbody id="historico"></tbody>
        </table>
    </section>

</main>

<script src="js/app.js"></script>

</body>
</html>
