<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Carina</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topo">
        <h1>📊 Controle Carina</h1>
        <p>Controle de Produtos e Pizzas</p>
    </header>

    <main class="container">

        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="card indicador saldo-card">
                <h3>🍕 Saldo Atual</h3>
                <div id="saldo" class="numero">9</div>
            </div>

            <div class="card indicador produto-card">
                <h3>📦 Produtos Recebidos</h3>
                <div id="totalProdutos" class="numero">0</div>
            </div>

            <div class="card indicador retirada-card">
                <h3>📉 Pizzas Retiradas</h3>
                <div id="totalRetiradas" class="numero">0</div>
            </div>

        </section>

        <!-- RECEBIMENTO -->

        <section class="card">

            <h2>📦 Recebimento de Produtos</h2>

            <label>Quantidade de Produtos</label>

            <input
                type="number"
                id="qtdProdutos"
                value="1"
                min="1">

            <button
                class="btn btn-sucesso"
                onclick="registrarRecebimento()">

                ➕ Registrar Recebimento

            </button>

        </section>

        <!-- RETIRADA -->

        <section class="card">

            <h2>🍕 Retirada da Carina</h2>

            <label>Quantidade de Pizzas</label>

            <input
                type="number"
                id="qtdRetirada"
                value="1"
                min="1">

            <button
                class="btn btn-perigo"
                onclick="registrarRetirada()">

                ➖ Registrar Retirada

            </button>

        </section>

        <!-- AÇÕES -->

        <section class="card">

            <h2>⚙️ Ações</h2>

            <div class="acoes">

                <button
                    class="btn btn-secundario"
                    onclick="desfazerUltimo()">

                    ↩️ Desfazer Último

                </button>

                <button
                    class="btn btn-whats"
                    onclick="copiarRelatorio()">

                    📱 Relatório WhatsApp

                </button>

            </div>

        </section>

        <!-- HISTÓRICO -->

        <section class="card">

            <h2>📜 Histórico de Movimentações</h2>

            <table>

                <thead>

                    <tr>
                        <th>Data/Hora</th>
                        <th>Movimento</th>
                        <th>Saldo</th>
                    </tr>

                </thead>

                <tbody id="historico"></tbody>

            </table>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
