<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Permuta - Carina</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --primary: #d97706;
      --primary-dark: #b45309;
      --primary-soft: #fef3c7;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --success: #15803d;
      --success-bg: #dcfce7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --whatsapp: #16a34a;
      --whatsapp-dark: #15803d;
      --shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 680px;
      margin: 0 auto 40px auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 1.45rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .btn-outline {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }

    .btn-outline:hover {
      background: #f3f4f6;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .saldo-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fcd34d;
    }

    .saldo-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: #92400e;
      margin: 0 0 4px 0;
    }

    .saldo-sub {
      font-size: 0.85rem;
      color: #b45309;
      margin: 0 0 8px 0;
    }

    .saldo-valor {
      font-size: 2.2rem;
      font-weight: 800;
      color: #b45309;
      margin: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .stat-title {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-num {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .btn-quick {
      border: none;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
      text-align: center;
    }

    .btn-quick:active {
      transform: scale(0.98);
    }

    .btn-credito {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #86efac;
    }

    .btn-retirada {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fca5a5;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-whatsapp {
      width: 100%;
      background: var(--whatsapp);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
